<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00CFFF" />
      <stop offset="45%" stop-color="#078BFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="60" y1="10" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#078BFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#078BFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fingerprintGrad" x1="40" y1="35" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00CFFF" />
      <stop offset="100%" stop-color="#078BFF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Shield Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#glowGrad)" />

  <!-- Outer Orbital Scanning Ring with radar tick marks -->
  <circle cx="60" cy="60" r="54" stroke="#078BFF" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3 4" />
  <circle cx="60" cy="60" r="54" stroke="#00CFFF" stroke-width="2" stroke-dasharray="25 150" stroke-linecap="round" filter="url(#neonGlow)" />
  <circle cx="60" cy="60" r="54" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="15 160" stroke-dashoffset="-70" stroke-linecap="round" />

  <!-- Four Electric-Blue HUD Scanning Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#078BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 108 24 L 108 12 L 96 12" stroke="#078BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 12 96 L 12 108 L 24 108" stroke="#078BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 108 96 L 108 108 L 96 108" stroke="#078BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Outer Futuristic Shield Contour -->
  <path d="M 60 16 L 96 30 L 96 62 C 96 87 60 102 60 102 C 60 102 24 87 24 62 L 24 30 Z" 
        fill="#101214" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Beveled Shield Trim -->
  <path d="M 60 23 L 89 35 L 89 61 C 89 81 60 94 60 94 C 60 94 31 81 31 61 L 31 35 Z" 
        fill="#151719" 
        stroke="#292D32" 
        stroke-width="1.2" />

  <!-- Detailed Digital Fingerprint Inside Shield -->
  <g stroke="url(#fingerprintGrad)" stroke-width="1.8" stroke-linecap="round" fill="none">
    <!-- Center Core Loop -->
    <path d="M 60 45 C 57 45 55 47 55 51 C 55 57 59 62 60 67 C 60.5 70 60 74 58 78" />
    
    <!-- Arch 1 (Inner Left) -->
    <path d="M 51 53 C 51 46 55 41 60 41 C 65 41 68 45 68 50 C 68 57 65 62 65 68 C 65 72 67 76 68 80" />
    
    <!-- Arch 2 (Mid Left) -->
    <path d="M 46 62 C 46 51 52 37 60 37 C 68 37 73 43 73 51 C 73 59 69 66 70 73 C 70.5 76 72 79 74 81" />
    
    <!-- Arch 3 (Outer Left) -->
    <path d="M 42 70 C 42 56 48 33 60 33 C 71 33 78 40 78 51 C 78 61 74 70 75 78 C 75.5 81 77 84 80 86" />
    
    <!-- Ridge 4 (Lower Left Base) -->
    <path d="M 39 76 C 39 67 43 56 48 48" />
    
    <!-- Center Biometric Core Point -->
    <circle cx="60" cy="51" r="1.5" fill="#00CFFF" stroke="none" />
  </g>

  <!-- Horizontal Scanning Laser Line with Gradient -->
  <line x1="32" y1="58" x2="88" y2="58" stroke="#00CFFF" stroke-width="1" stroke-opacity="0.8" stroke-dasharray="4 2" />
  <circle cx="60" cy="58" r="2.5" fill="#FFFFFF" filter="url(#neonGlow)" />
</svg>

